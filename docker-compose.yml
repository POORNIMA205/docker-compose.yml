services:

  travel-app:

    build:
      context: .

    container_name: travel-explorer

    ports:
      - "5000:5000"

    env_file:
      - .env

    restart: unless-stopped

    healthcheck:

      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
        ]

      interval: 30s

      timeout: 10s

      retries: 3

      start_period: 10s